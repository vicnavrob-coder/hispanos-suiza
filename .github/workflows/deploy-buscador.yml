name: Deploy Buscador Empleo Suiza

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout buscador-empleo-suiza
        uses: actions/checkout@v4
        with:
          repository: vicnavrob-coder/buscador-empleo-suiza
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Create or get Vercel project and deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          # Try to get existing project
          PROJECT_RESP=$(curl -s \
            "https://api.vercel.com/v9/projects/buscador-empleo-suiza" \
            -H "Authorization: Bearer $VERCEL_TOKEN")

          PROJECT_ID=$(echo "$PROJECT_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)

          if [ -z "$PROJECT_ID" ]; then
            echo "Creating new Vercel project..."
            CREATE_RESP=$(curl -s -X POST \
              "https://api.vercel.com/v10/projects" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"buscador-empleo-suiza\",\"framework\":null}")
            echo "Create response: $CREATE_RESP"
            PROJECT_ID=$(echo "$CREATE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)
          fi

          echo "Project ID: $PROJECT_ID"
          
          if [ -z "$PROJECT_ID" ]; then
            echo "ERROR: Could not get or create Vercel project"
            exit 1
          fi

          # Deploy using the project ID
          VERCEL_PROJECT_ID="$PROJECT_ID" vercel --prod --yes --token="$VERCEL_TOKEN"
